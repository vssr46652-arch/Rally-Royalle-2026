<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="RG6XdhLYeT6usINt_qpWAiO1mAwouLID-Af08zVefEE" />
  <title>RALLY ROYALLE — Tennis Tournament</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1b4332;
      --accent: #d4af37;
      --bg-dark: #081c15;
      --text-light: #f8f9fa;
      --text-muted: #adb5bd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(rgba(8, 28, 21, 0.85), rgba(8, 28, 21, 0.95));
    }

    .hero h1 {
      font-size: 3.5rem;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.25rem;
      max-width: 600px;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .btn-whatsapp {
      display: inline-block;
      background-color: #25d366;
      color: #ffffff;
      padding: 0.85rem 1.75rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 50px;
      transition: background-color 0.3s ease;
    }

    .btn-whatsapp:hover {
      background-color: #1ebc57;
    }

    .venue-photo {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-top: 2rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1>Welcome to Rally Royalle</h1>
    <p>Join the ultimate tennis tournament experience. Register now or connect with us directly via WhatsApp.</p>
    
    <a href="https://wa.me/" class="btn-whatsapp" target="_blank" rel="noopener noreferrer">
      Contact on WhatsApp
    </a>
  </section>

  <footer>
    <p>&copy; RALLY ROYALLE. All rights reserved.</p>
  </footer>

</body>
</html>
